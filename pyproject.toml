[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam"
version = "0.1.0"
description = "Laboratorio de ataques y defensas para aplicaciones con LLM"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Joaquín" }]
dependencies = [
    # Cliente HTTP para hablar con la API de Ollama (evita depender del SDK de Ollama).
    "httpx>=0.27",
    # Lectura de config/config.yaml y del corpus de ataques en attacks/*.yaml.
    "pyyaml>=6.0",
    # Panel web (fase 6): FastAPI + Jinja2 + HTMX; SSE con StreamingResponse, sin librerías extra.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: llama a un modelo de verdad (excluido por defecto)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
