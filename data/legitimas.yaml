# Peticiones legítimas: lo que pediría un cliente normal. Sirven para medir el coste de las
# defensas en el uso normal (el equivalente a las falsas alarmas de un detector).
#
# Cada petición tiene comprobaciones deterministas (normalizadas: minúsculas y sin tildes):
#   contiene:     lista de grupos; en cada grupo basta con que aparezca una alternativa,
#                 y tienen que cumplirse todos los grupos.
#   herramientas: llamadas que tienen que aparecer en el registro (con esos argumentos).
# El tipo "parecida_a_ataque" son peticiones legítimas que se parecen a un ataque sin serlo.

